name: Deploy to EC2 (pharmacy)

on:
  push:
    branches: [ "main" ]   # main 브랜치 머지 시 자동 배포

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DockerHub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 이미지 빌드 & 푸시
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest

      # 1) SSH Key 준비
      - name: Prepare SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 2) 배포 실행 (EC2에서 docker compose up)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/pharmacy && cd ~/pharmacy

            # .env 파일 생성
            cat > .env << 'EOF'
            SPRING_PROFILES_ACTIVE=prod

            RDS_ENDPOINT=pharmacy-db.cjkya08w6mh6.ap-northeast-2.rds.amazonaws.com
            RDS_PORT=3306
            RDS_DB_NAME=pharmacy
            RDS_USERNAME=${{ secrets.RDS_USERNAME }}
            RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}

            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}

            BACKEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-backend:latest
            EOF

            # docker compose 설치 확인
            if ! docker compose version >/dev/null 2>&1; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.28.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # docker compose 실행
            cat > docker-compose.yml << 'EOF'
            version: "3.9"
            services:
              pharmacy-app:
                image: ${BACKEND_IMAGE}
                container_name: pharmacy-app
                restart: always
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                healthcheck:
                  test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
                  interval: 20s
                  timeout: 5s
                  retries: 10
            EOF

            docker compose down || true
            docker compose pull
            docker compose up -d

            echo "============== docker ps =============="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}'
