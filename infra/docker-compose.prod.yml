version: "3.9"

services:
  pharmacy-app:
    container_name: pharmacy-app
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
