version: "3.9"
services:
  pharmacy-app:
    image: ${BACKEND_IMAGE}
    container_name: pharmacy-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # ✅ prod는 RDS_*만 읽으므로 그대로 전달
      - RDS_ENDPOINT=${RDS_ENDPOINT}
      - RDS_PORT=${RDS_PORT}
      - RDS_DB_NAME=${RDS_DB_NAME}
      - RDS_USERNAME=${RDS_USERNAME}
      - RDS_PASSWORD=${RDS_PASSWORD}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
