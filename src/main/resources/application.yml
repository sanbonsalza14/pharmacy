spring:
  application:
    name: pharmacy

  profiles:
    # 기본은 dev, 배포 시 환경변수 SPRING_PROFILES_ACTIVE=prod 로 덮어쓰기
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
